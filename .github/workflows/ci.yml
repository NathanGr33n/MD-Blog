name: CI

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (static export)
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
